<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente No Videntes - Audio Espacial Real</title>
    
    <!-- TensorFlow.js y COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            margin-right: 5px;
        }
        .btn-secondary {
            background-color: #2196F3;
        }
        .video-container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video {
            width: 100%;
            max-width: 360px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            display: block;
            margin: 0 auto;
        }
        .data-box {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Asistente Wearable Dual</h1>
    <p id="loadingText">Cargando sistema de sensores...</p>

    <div>
        <button id="startBtn" style="display:none;">Iniciar Marcha (Obstáculos)</button>
        <button id="exploreBtn" class="btn-secondary" style="display:none;">Explorar Entorno</button>
    </div>

    <div class="video-container">
        <video id="cameraStream" autoplay playsinline muted></video>
    </div>

    <div class="data-box">
        <h3>Estado:</h3>
        <p id="modeStatus">Modo: En espera</p>
        <p id="aiStatus">IA: Lista</p>
        <p id="motionStatus">Movimiento: Inactivo</p>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const exploreBtn = document.getElementById('exploreBtn');
        const loadingText = document.getElementById('loadingText');
        const videoElement = document.getElementById('cameraStream');
        const motionStatus = document.getElementById('motionStatus');
        const aiStatus = document.getElementById('aiStatus');
        const modeStatus = document.getElementById('modeStatus');

        let cocoModel = null;
        let audioCtx = null;
        let isWalking = false;
        let lastAlertTime = 0;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Reproduce un tono estéreo real directamente en el auricular izquierdo o derecho
        // pan: -1.0 (izq total), 0.0 (centro), 1.0 (der total)
        function playSpatialBeep(pan = 0.0) {
            if (!audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota Re5 (aguda y clara)

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.connect(gain);

            if (panner) {
                panner.pan.setValueAtTime(pan, audioCtx.currentTime);
                gain.connect(panner);
                panner.connect(audioCtx.destination);
            } else {
                gain.connect(audioCtx.destination);
            }

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function initSystem() {
            try {
                await tf.ready();
                cocoModel = await cocoSsd.load();
                loadingText.innerText = "Sistema preparado.";
                startBtn.style.display = 'inline-block';
                exploreBtn.style.display = 'inline-block';
                speak("Sistema listo. Seleccione modo marcha o exploración.");
            } catch (error) {
                loadingText.innerText = "Error al iniciar modelos.";
            }
        }

        initSystem();

        // Iniciar Cámara
        async function startCamera() {
            try {
                if (!videoElement.srcObject) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    });
                    videoElement.srcObject = stream;
                }
            } catch (e) {
                console.error("Error de cámara", e);
            }
        }

        // 1. MODO MARCHA: Detección rápida de obstáculos sin procesar texto ni IA pesada de reconocimiento
        startBtn.addEventListener('click', async () => {
            initAudioContext();
            await startCamera();
            isWalking = true;
            modeStatus.innerText = "Modo: Marcha (Evitar obstáculos)";
            speak("Modo marcha activado. Cuidado al caminar.", true);

            runObstacleDetectionLoop();
        });

        async function runObstacleDetectionLoop() {
            if (!isWalking) return;

            if (cocoModel && videoElement.readyState === 4) {
                try {
                    // Usamos el modelo solo para ubicar bultos/masas genéricas sin importar la clase exacta,
                    // o evaluamos las coordenadas horizontales de cualquier objeto detectado con confianza moderada.
                    const predictions = await cocoModel.detect(videoElement);
                    
                    if (predictions.length > 0) {
                        // Filtrar el objeto más cercano o relevante en pantalla
                        const closest = predictions.reduce((prev, curr) => (prev.bbox[1] > curr.bbox[1]) ? prev : curr);
                        
                        if (closest.score > 0.50) {
                            const videoWidth = videoElement.videoWidth || 640;
                            const objectX = closest.bbox[0] + (closest.bbox[2] / 2);
                            const normalizedPan = (objectX / videoWidth) * 2 - 1; // -1 (izq) a 1 (der)

                            const now = Date.now();
                            if (now - lastAlertTime > 500) { // Bip dinámico cada medio segundo si hay obstáculo
                                playSpatialBeep(normalizedPan);
                                lastAlertTime = now;
                            }
                            aiStatus.innerText = `Obstáculo detectado (Pan: ${normalizedPan.toFixed(1)})`;
                        }
                    } else {
                        aiStatus.innerText = "Camino despejado";
                    }
                } catch (e) {
                    console.error(e);
                }
            }

            if (isWalking) {
                setTimeout(runObstacleDetectionLoop, 400); // Ultrarrápido para caminar
            }
        }

        // 2. MODO EXPLORACIÓN: Se detiene y nombra el objeto al apuntar
        exploreBtn.addEventListener('click', async () => {
            initAudioContext();
            isWalking = false; // Detiene el modo marcha
            modeStatus.innerText = "Modo: Exploración puntual";
            speak("Modo exploración. Apunte a un objeto.", true);
            await startCamera();

            if (cocoModel && videoElement.readyState === 4) {
                const predictions = await cocoModel.detect(videoElement);
                if (predictions.length > 0) {
                    const top = predictions[0];
                    const translated = translateClass(top.class);
                    
                    const videoWidth = videoElement.videoWidth || 640;
                    const objectX = top.bbox[0] + (top.bbox[2] / 2);
                    const pan = (objectX / videoWidth) * 2 - 1;

                    // Reproduce un pequeño tono espacial y luego enuncia el objeto
                    playSpatialBeep(pan);
                    setTimeout(() => speak(translated), 200);
                    aiStatus.innerText = `Identificado: ${translated}`;
                } else {
                    speak("No se reconoce ningún objeto claro frente a ti.");
                }
            }
        });

        function translateClass(className) {
            const translations = {
                'person': 'Persona',
                'bicycle': 'Bicicleta',
                'car': 'Auto',
                'chair': 'Silla',
                'potted plant': 'Planta o matera',
                'backpack': 'Mochila o bulto',
                'dog': 'Perro'
            };
            return translations[className] || 'Objeto al frente';
        }

        // Acelerómetro de control de movimiento básico
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (event) => {
                const acc = event.accelerationIncludingGravity;
                if (acc && acc.x !== null) {
                    motionStatus.innerText = `Movimiento OK (X:${acc.x.toFixed(1)})`;
                }
            });
        }
    </script>
</body>
</html>
