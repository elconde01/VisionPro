<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente No Videntes - Exploración Continua</title>
    
    <!-- TensorFlow.js y COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        button, input {
            font-size: 16px;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-top: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            margin-right: 5px;
        }
        .btn-secondary {
            background-color: #2196F3;
        }
        .btn-stop {
            background-color: #f44336;
        }
        input {
            width: 80%;
            max-width: 320px;
            background: #2b2b2b;
            color: white;
            border: 1px solid #444;
            display: block;
            margin: 10px auto;
            text-align: center;
        }
        .video-container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video {
            width: 100%;
            max-width: 360px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            display: block;
            margin: 0 auto;
        }
        .data-box {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <h1>Asistente Wearable</h1>
    <p id="loadingText">Cargando sistema de sensores...</p>

    <div>
        <input type="text" id="destinationInput" placeholder="Ingrese destino (ej. San Martín 2500)">
        <button id="setRouteBtn" class="btn-secondary">Establecer Ruta</button>
    </div>

    <div>
        <button id="startBtn" style="display:none;">Iniciar Marcha</button>
        <button id="exploreBtn" class="btn-secondary" style="display:none;">Explorar Entorno (Continuo)</button>
        <button id="stopBtn" class="btn-stop" style="display:none;">Detener Todo</button>
    </div>

    <div class="video-container">
        <video id="cameraStream" autoplay playsinline muted></video>
    </div>

    <div class="data-box">
        <h3>Estado:</h3>
        <p id="modeStatus">Modo: En espera</p>
        <p id="routeStatus">Ruta: Sin destino activo</p>
        <p id="aiStatus">IA: Lista</p>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const exploreBtn = document.getElementById('exploreBtn');
        const stopBtn = document.getElementById('stopBtn');
        const setRouteBtn = document.getElementById('setRouteBtn');
        const destinationInput = document.getElementById('destinationInput');
        const loadingText = document.getElementById('loadingText');
        const videoElement = document.getElementById('cameraStream');
        const aiStatus = document.getElementById('aiStatus');
        const modeStatus = document.getElementById('modeStatus');
        const routeStatus = document.getElementById('routeStatus');

        let cocoModel = null;
        let audioCtx = null;
        let currentMode = "IDLE"; // "IDLE", "WALKING", "EXPLORING"
        let lastAlertTime = 0;
        let lastSpokenExploreObject = "";
        let currentPosition = null;
        let targetDestination = "";

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playDistinctSpatialAlert(pan = 0.0) {
            if (!audioCtx) return;
            const isLeft = pan < 0;
            const freq = isLeft ? 440 : 880; 
            
            if (!isLeft) {
                playTone(freq, pan, 0.0, 0.08);
                setTimeout(() => playTone(freq, pan, 0.0, 0.08), 120);
            } else {
                playTone(freq, pan, 0.0, 0.2);
            }
        }

        function playTone(freq, pan, delay, duration) {
            const startTime = audioCtx.currentTime + delay;
            const osc = audioCtx.createOscillator();
            const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.35, startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            osc.connect(gain);

            if (panner) {
                panner.pan.setValueAtTime(pan, startTime);
                gain.connect(panner);
                panner.connect(audioCtx.destination);
            } else {
                gain.connect(audioCtx.destination);
            }

            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function speak(text, force = false) {
            if ('speechSynthesis' in window) {
                if (force) window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function initSystem() {
            try {
                await tf.ready();
                cocoModel = await cocoSsd.load();
                loadingText.innerText = "Sistema preparado.";
                startBtn.style.display = 'inline-block';
                exploreBtn.style.display = 'inline-block';
                stopBtn.style.display = 'inline-block';
                speak("Sistema listo. Seleccione modo marcha o exploración continua.");
            } catch (error) {
                loadingText.innerText = "Error al iniciar modelos.";
            }
        }

        initSystem();

        async function startCamera() {
            try {
                if (!videoElement.srcObject) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    });
                    videoElement.srcObject = stream;
                }
            } catch (e) {
                console.error("Error de cámara", e);
            }
        }

        setRouteBtn.addEventListener('click', () => {
            const dest = destinationInput.value.trim();
            if (dest) {
                targetDestination = dest;
                routeStatus.innerText = `Destino: ${dest}`;
                speak(`Ruta establecida hacia ${dest}.`);
            } else {
                speak("Por favor, ingrese un destino válido.");
            }
        });

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    currentPosition = { lat: position.coords.latitude, lon: position.coords.longitude };
                },
                (error) => { console.error("GPS error", error); },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
            );
        }

        // Botón Detener Todo
        stopBtn.addEventListener('click', () => {
            currentMode = "IDLE";
            modeStatus.innerText = "Modo: Detenido";
            window.speechSynthesis.cancel();
            speak("Sistema en pausa.", true);
        });

        // 1. MODO MARCHA
        startBtn.addEventListener('click', async () => {
            initAudioContext();
            await startCamera();
            currentMode = "WALKING";
            modeStatus.innerText = "Modo: Marcha y Ruta Activa";
            speak("Modo marcha activado.", true);

            mainLoop();
        });

        // 2. MODO EXPLORACIÓN CONTINUA
        exploreBtn.addEventListener('click', async () => {
            initAudioContext();
            await startCamera();
            currentMode = "EXPLORING";
            modeStatus.innerText = "Modo: Exploración Continua";
            lastSpokenExploreObject = "";
            speak("Modo exploración continua activado. Mueva la cámara lentamente.", true);

            mainLoop();
        });

        // Bucle centralizador de inteligencia artificial según el modo activo
        async function mainLoop() {
            if (currentMode === "IDLE") return;

            if (cocoModel && videoElement.readyState === 4) {
                try {
                    const predictions = await cocoModel.detect(videoElement);

                    if (currentMode === "WALKING") {
                        // Lógica de obstáculos para marcha
                        const relevantObstacles = predictions.filter(p => p.score > 0.55);
                        if (relevantObstacles.length > 0) {
                            const closest = relevantObstacles.reduce((prev, curr) => (prev.bbox[1] > curr.bbox[1]) ? prev : curr);
                            const videoWidth = videoElement.videoWidth || 640;
                            const objectX = closest.bbox[0] + (closest.bbox[2] / 2);
                            const normalizedPan = (objectX / videoWidth) * 2 - 1;

                            const now = Date.now();
                            if (now - lastAlertTime > 1200) {
                                playDistinctSpatialAlert(normalizedPan);
                                if (normalizedPan < -0.25) speak("Desviar a la derecha");
                                else if (normalizedPan > 0.25) speak("Desviar a la izquierda");
                                else speak("Obstáculo al frente");
                                lastAlertTime = now;
                            }
                            aiStatus.innerText = `Obstáculo (${normalizedPan < 0 ? 'Izquierda' : 'Derecha'})`;
                        } else {
                            aiStatus.innerText = "Camino despejado";
                        }
                    } 
                    else if (currentMode === "EXPLORING") {
                        // Lógica de exploración continua
                        if (predictions.length > 0) {
                            const top = predictions.reduce((prev, current) => (prev.score > current.score) ? prev : current);
                            if (top.score > 0.60) {
                                const translated = translateClass(top.class);
                                
                                const videoWidth = videoElement.videoWidth || 640;
                                const objectX = top.bbox[0] + (top.bbox[2] / 2);
                                const pan = (objectX / videoWidth) * 2 - 1;

                                // Si el objeto detectado cambia respecto al anterior que se nombró, avisa de inmediato
                                if (translated !== lastSpokenExploreObject) {
                                    playDistinctSpatialAlert(pan);
                                    speak(translated);
                                    lastSpokenExploreObject = translated;
                                }
                                aiStatus.innerText = `Explorando: ${translated}`;
                            }
                        } else {
                            aiStatus.innerText = "Explorando: Buscando objetos...";
                            lastSpokenExploreObject = ""; // Resetea para cuando aparezca algo nuevo
                        }
                    }
                } catch (err) {
                    console.error("Error en bucle de IA:", err);
                }
            }

            // Continuar el bucle según el estado actual
            if (currentMode !== "IDLE") {
                setTimeout(mainLoop, currentMode === "WALKING" ? 500 : 1000);
            }
        }

        function translateClass(className) {
            const translations = {
                'person': 'Persona',
                'bicycle': 'Bicicleta',
                'car': 'Auto',
                'chair': 'Silla',
                'potted plant': 'Planta',
                'backpack': 'Mochila o bulto',
                'dog': 'Perro'
            };
            return translations[className] || className;
        }
    </script>
</body>
</html>
