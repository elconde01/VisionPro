<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente No Videntes - Tonos Diferenciados</title>
    
    <!-- TensorFlow.js y COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            margin-right: 5px;
        }
        .btn-secondary {
            background-color: #2196F3;
        }
        .video-container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video {
            width: 100%;
            max-width: 360px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            display: block;
            margin: 0 auto;
        }
        .data-box {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Asistente Wearable</h1>
    <p id="loadingText">Cargando sistema de sensores...</p>

    <div>
        <button id="startBtn" style="display:none;">Iniciar Marcha (Silencio / Alerta)</button>
        <button id="exploreBtn" class="btn-secondary" style="display:none;">Explorar Entorno</button>
    </div>

    <div class="video-container">
        <video id="cameraStream" autoplay playsinline muted></video>
    </div>

    <div class="data-box">
        <h3>Estado:</h3>
        <p id="modeStatus">Modo: En espera</p>
        <p id="aiStatus">IA: Lista</p>
        <p id="motionStatus">Movimiento: Inactivo</p>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const exploreBtn = document.getElementById('exploreBtn');
        const loadingText = document.getElementById('loadingText');
        const videoElement = document.getElementById('cameraStream');
        const motionStatus = document.getElementById('motionStatus');
        const aiStatus = document.getElementById('aiStatus');
        const modeStatus = document.getElementById('modeStatus');

        let cocoModel = null;
        let audioCtx = null;
        let isWalking = false;
        let lastAlertTime = 0;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Generador de alertas acústicas inequívocas por lado
        // pan: -1.0 (izq total), 1.0 (der total)
        function playDistinctSpatialAlert(pan = 0.0) {
            if (!audioCtx) return;

            const isLeft = pan < 0;
            const freq = isLeft ? 440 : 880; // Izquierda: Tono grave (440Hz) | Derecha: Tono agudo (880Hz)
            
            if (!isLeft) {
                // DOBLE BIP para la DERECHA (patrón rítmico distintivo)
                playTone(freq, pan, 0.0, 0.08);
                setTimeout(() => playTone(freq, pan, 0.0, 0.08), 120);
            } else {
                // BIP ÚNICO y más largo para la IZQUIERDA
                playTone(freq, pan, 0.0, 0.2);
            }
        }

        function playTone(freq, pan, delay, duration) {
            const startTime = audioCtx.currentTime + delay;
            const osc = audioCtx.createOscillator();
            const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);

            gain.gain.setValueAtTime(0.35, startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);

            osc.connect(gain);

            if (panner) {
                panner.pan.setValueAtTime(pan, startTime);
                gain.connect(panner);
                panner.connect(audioCtx.destination);
            } else {
                gain.connect(audioCtx.destination);
            }

            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function initSystem() {
            try {
                await tf.ready();
                cocoModel = await cocoSsd.load();
                loadingText.innerText = "Sistema preparado.";
                startBtn.style.display = 'inline-block';
                exploreBtn.style.display = 'inline-block';
                speak("Sistema listo. Seleccione modo marcha o exploración.");
            } catch (error) {
                loadingText.innerText = "Error al iniciar modelos.";
            }
        }

        initSystem();

        async function startCamera() {
            try {
                if (!videoElement.srcObject) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    });
                    videoElement.srcObject = stream;
                }
            } catch (e) {
                console.error("Error de cámara", e);
            }
        }

        // 1. MODO MARCHA
        startBtn.addEventListener('click', async () => {
            initAudioContext();
            await startCamera();
            isWalking = true;
            modeStatus.innerText = "Modo: Marcha (Silencio / Alerta)";
            speak("Modo marcha activado. Camino despejado.", true);

            runObstacleDetectionLoop();
        });

        async function runObstacleDetectionLoop() {
            if (!isWalking) return;

            if (cocoModel && videoElement.readyState === 4) {
                try {
                    const predictions = await cocoModel.detect(videoElement);
                    const relevantObstacles = predictions.filter(p => p.score > 0.55);
                    
                    if (relevantObstacles.length > 0) {
                        const closest = relevantObstacles.reduce((prev, curr) => (prev.bbox[1] > curr.bbox[1]) ? prev : curr);
                        
                        const videoWidth = videoElement.videoWidth || 640;
                        const objectX = closest.bbox[0] + (closest.bbox[2] / 2);
                        const normalizedPan = (objectX / videoWidth) * 2 - 1;

                        const now = Date.now();
                        if (now - lastAlertTime > 1200) {
                            playDistinctSpatialAlert(normalizedPan);

                            if (normalizedPan < -0.25) {
                                speak("Desviar a la derecha");
                            } else if (normalizedPan > 0.25) {
                                speak("Desviar a la izquierda");
                            } else {
                                speak("Obstáculo al frente");
                            }

                            lastAlertTime = now;
                        }
                        aiStatus.innerText = `Obstáculo detectado (${normalizedPan < 0 ? 'Izquierda' : 'Derecha'})`;
                    } else {
                        aiStatus.innerText = "Camino despejado";
                    }
                } catch (e) {
                    console.error(e);
                }
            }

            if (isWalking) {
                setTimeout(runObstacleDetectionLoop, 500);
            }
        }

        // 2. MODO EXPLORACIÓN
        exploreBtn.addEventListener('click', async () => {
            initAudioContext();
            isWalking = false; 
            modeStatus.innerText = "Modo: Exploración puntual";
            speak("Modo exploración. Apunte a un objeto.", true);
            await startCamera();

            if (cocoModel && videoElement.readyState === 4) {
                const predictions = await cocoModel.detect(videoElement);
                if (predictions.length > 0) {
                    const top = predictions[0];
                    const translated = translateClass(top.class);
                    
                    const videoWidth = videoElement.videoWidth || 640;
                    const objectX = top.bbox[0] + (top.bbox[2] / 2);
                    const pan = (objectX / videoWidth) * 2 - 1;

                    playDistinctSpatialAlert(pan);
                    setTimeout(() => speak(translated), 250);
                    aiStatus.innerText = `Identificado: ${translated}`;
                } else {
                    speak("No se reconoce ningún objeto claro frente a ti.");
                }
            }
        });

        function translateClass(className) {
            const translations = {
                'person': 'Persona',
                'bicycle': 'Bicicleta',
                'car': 'Auto',
                'chair': 'Silla',
                'potted plant': 'Planta o matera',
                'backpack': 'Mochila o bulto',
                'dog': 'Perro'
            };
            return translations[className] || 'Objeto al frente';
        }

        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (event) => {
                const acc = event.accelerationIncludingGravity;
                if (acc && acc.x !== null) {
                    motionStatus.innerText = `Movimiento OK (X:${acc.x.toFixed(1)})`;
                }
            });
        }
    </script>
</body>
</html>
