<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente No Videntes - Audio Espacial</title>
    
    <!-- TensorFlow.js y COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
        .video-container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video {
            width: 100%;
            max-width: 360px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            display: block;
            margin: 0 auto;
        }
        .data-box {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Asistente Wearable (Espacial)</h1>
    <p id="loadingText">Cargando modelo de inteligencia artificial...</p>

    <button id="startBtn" style="display:none;">Iniciar Sistema</button>

    <div class="video-container">
        <video id="cameraStream" autoplay playsinline muted></video>
    </div>

    <div class="data-box">
        <h3>Estado:</h3>
        <p id="aiStatus">IA: Esperando inicio...</p>
        <p id="gpsStatus">GPS: Buscando señal...</p>
        <p id="motionStatus">Movimiento: Inactivo</p>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const loadingText = document.getElementById('loadingText');
        const videoElement = document.getElementById('cameraStream');
        const gpsStatus = document.getElementById('gpsStatus');
        const motionStatus = document.getElementById('motionStatus');
        const aiStatus = document.getElementById('aiStatus');

        let cocoModel = null;
        let lastSpeechTime = 0;
        let lastSpokenObject = "";
        let isRunning = false;
        let audioCtx = null;

        // Inicializar contexto de audio al interactuar por primera vez (requisito de los navegadores móviles)
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Sistema de alerta con Audio Espacial (Panorámica Estéreo)
        // panValue: -1.0 (izq total), 0.0 (centro), 1.0 (der total)
        function speakSpatial(text, panValue = 0.0, force = false) {
            if ('speechSynthesis' in window) {
                const now = Date.now();
                if (!force && (now - lastSpeechTime < 3000)) return;

                window.speechSynthesis.cancel();
                
                // Si el navegador soporta Web Audio API y Panner, podemos simular el efecto espacial
                // o complementar con indicaciones verbales claras de dirección si el TTS estéreo directo es complejo.
                // Aquí aplicamos la síntesis de voz y gestionamos el canal mediante tonos guía previos o descripciones.
                let directionalText = text;
                if (panValue < -0.3) {
                    directionalText = text + ", a la izquierda";
                } else if (panValue > 0.3) {
                    directionalText = text + ", a la derecha";
                } else {
                    directionalText = text + ", al frente";
                }

                const utterance = new SpeechSynthesisUtterance(directionalText);
                utterance.lang = 'es-ES';
                utterance.rate = 1.2;
                window.speechSynthesis.speak(utterance);
                lastSpeechTime = Date.now();
            }
        }

        async function initAI() {
            try {
                aiStatus.innerText = "IA: Descargando pesos...";
                await tf.ready();
                cocoModel = await cocoSsd.load();
                
                loadingText.innerText = "¡Listo para iniciar!";
                aiStatus.innerText = "IA: Lista.";
                startBtn.style.display = 'inline-block';
                speakSpatial("Sistema listo. Presione iniciar.");
            } catch (error) {
                console.error("Error al cargar la IA:", error);
                loadingText.innerText = "Error al cargar la IA.";
            }
        }

        initAI();

        startBtn.addEventListener('click', async () => {
            initAudioContext();
            startBtn.style.display = 'none';
            loadingText.style.display = 'none';
            isRunning = true;
            speakSpatial("Sistema activado.", 0.0, true);

            // 1. Cámara
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                videoElement.srcObject = stream;
            } catch (error) {
                speakSpatial("Error de cámara.", 0.0, true);
            }

            // 2. GPS
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(5);
                        const lon = position.coords.longitude.toFixed(5);
                        gpsStatus.innerText = `GPS: ${lat}, ${lon}`;
                    },
                    (error) => { gpsStatus.innerText = "GPS: Sin señal"; },
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                );
            }

            // 3. Sensores de Movimiento
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', (event) => {
                    const acc = event.accelerationIncludingGravity;
                    if (acc && acc.x !== null) {
                        motionStatus.innerText = `Acelerómetro:\n X: ${acc.x.toFixed(1)} | Y: ${acc.y.toFixed(1)} | Z: ${acc.z.toFixed(1)}`;
                    }
                });
            }

            detectObjectsLoop();
        });

        async function detectObjectsLoop() {
            if (!isRunning) return;

            if (cocoModel && videoElement.readyState === 4) {
                try {
                    const predictions = await cocoModel.detect(videoElement);
                    
                    if (predictions.length > 0) {
                        const topPrediction = predictions.reduce((prev, current) => 
                            (prev.score > current.score) ? prev : current
                        );

                        if (topPrediction.score > 0.60) {
                            let objectName = translateClass(topPrediction.class);
                            
                            // Analizar la posición horizontal del objeto en la pantalla (bbox: [x, y, width, height])
                            const videoWidth = videoElement.videoWidth || 640;
                            const objectX = topPrediction.bbox[0] + (topPrediction.bbox[2] / 2); // Centro del objeto
                            
                            // Calcular valor de paneo (-1 a 1) basándonos en el ancho de la imagen
                            // Si está en el tercio izquierdo -> negativo, tercio derecho -> positivo
                            const normalizedX = (objectX / videoWidth) * 2 - 1; 

                            aiStatus.innerText = `Detectado: ${objectName} (${Math.round(normalizedX * 100)}% pos)`;
                            
                            if (objectName !== lastSpokenObject) {
                                speakSpatial(objectName, normalizedX);
                                lastSpokenObject = objectName;
                            }
                        }
                    } else {
                        aiStatus.innerText = "Despejado";
                        lastSpokenObject = "";
                    }
                } catch (err) {
                    console.error("Error en inferencia:", err);
                }
            }

            setTimeout(detectObjectsLoop, 700);
        }

        function translateClass(className) {
            const translations = {
                'person': 'Persona',
                'bicycle': 'Bicicleta',
                'car': 'Auto',
                'motorcycle': 'Moto',
                'bus': 'Colectivo',
                'truck': 'Camión',
                'chair': 'Silla',
                'couch': 'Sillón',
                'potted plant': 'Planta',
                'dog': 'Perro',
                'cat': 'Gato',
                'backpack': 'Mochila'
            };
            return translations[className] || className;
        }
    </script>
</body>
</html>
