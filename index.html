<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente No Videntes - Optimizado</title>
    
    <!-- TensorFlow.js y COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
        .video-container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video {
            width: 100%;
            max-width: 360px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            display: block;
            margin: 0 auto;
        }
        .data-box {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Asistente Wearable</h1>
    <p id="loadingText">Cargando modelo de inteligencia artificial...</p>

    <button id="startBtn" style="display:none;">Iniciar Sistema</button>

    <div class="video-container">
        <video id="cameraStream" autoplay playsinline muted></video>
    </div>

    <div class="data-box">
        <h3>Estado:</h3>
        <p id="aiStatus">IA: Esperando inicio...</p>
        <p id="gpsStatus">GPS: Buscando señal...</p>
        <p id="motionStatus">Movimiento: Inactivo</p>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const loadingText = document.getElementById('loadingText');
        const videoElement = document.getElementById('cameraStream');
        const gpsStatus = document.getElementById('gpsStatus');
        const motionStatus = document.getElementById('motionStatus');
        const aiStatus = document.getElementById('aiStatus');

        let cocoModel = null;
        let lastSpeechTime = 0;
        let lastSpokenObject = "";
        let isRunning = false;

        // Función de Síntesis de Voz optimizada para máxima velocidad
        function speak(text, force = false) {
            if ('speechSynthesis' in window) {
                const now = Date.now();
                // Reducimos el tiempo de espera a 3 segundos entre alertas automáticas para mayor dinamismo
                if (!force && (now - lastSpeechTime < 3000)) return;

                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.2; // Ligeramente más rápido y dinámico
                window.speechSynthesis.speak(utterance);
                lastSpeechTime = Date.now();
            }
        }

        async function initAI() {
            try {
                aiStatus.innerText = "IA: Descargando pesos...";
                await tf.ready();
                cocoModel = await cocoSsd.load();
                
                loadingText.innerText = "¡Listo para iniciar!";
                aiStatus.innerText = "IA: Lista.";
                startBtn.style.display = 'inline-block';
                speak("Sistema listo. Presione iniciar.");
            } catch (error) {
                console.error("Error al cargar la IA:", error);
                loadingText.innerText = "Error al cargar la IA.";
            }
        }

        initAI();

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            loadingText.style.display = 'none';
            isRunning = true;
            speak("Sistema activado.", true);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                videoElement.srcObject = stream;
            } catch (error) {
                speak("Error de cámara.", true);
            }

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(5);
                        const lon = position.coords.longitude.toFixed(5);
                        gpsStatus.innerText = `GPS: ${lat}, ${lon}`;
                    },
                    (error) => { gpsStatus.innerText = "GPS: Sin señal"; },
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                );
            }

            detectObjectsLoop();
        });

        // Bucle de análisis optimizado y veloz
        async function detectObjectsLoop() {
            if (!isRunning) return;

            if (cocoModel && videoElement.readyState === 4) {
                try {
                    const predictions = await cocoModel.detect(videoElement);
                    
                    if (predictions.length > 0) {
                        const topPrediction = predictions.reduce((prev, current) => 
                            (prev.score > current.score) ? prev : current
                        );

                        if (topPrediction.score > 0.60) {
                            let objectName = translateClass(topPrediction.class);
                            aiStatus.innerText = `Detectado: ${objectName} (${Math.round(topPrediction.score * 100)}%)`;
                            
                            // Solo habla si el objeto detectado es diferente al anterior o pasaron varios segundos
                            if (objectName !== lastSpokenObject) {
                                speak(objectName); // Frase ultra corta y directa
                                lastSpokenObject = objectName;
                            }
                        }
                    } else {
                        aiStatus.innerText = "Despejado";
                        lastSpokenObject = ""; // Resetea para avisar si vuelve a aparecer algo
                    }
                } catch (err) {
                    console.error("Error en inferencia:", err);
                }
            }

            // Intervalo acortado a 700ms para respuestas mucho más ágiles en movimiento
            setTimeout(detectObjectsLoop, 700);
        }

        function translateClass(className) {
            const translations = {
                'person': 'Persona al frente',
                'bicycle': 'Bicicleta',
                'car': 'Auto',
                'motorcycle': 'Moto',
                'bus': 'Colectivo',
                'truck': 'Camión',
                'chair': 'Silla',
                'couch': 'Sillón',
                'potted plant': 'Planta o tronco',
                'dog': 'Perro',
                'cat': 'Gato',
                'backpack': 'Mochila'
            };
            return translations[className] || className;
        }
    </script>
</body>
</html>
