<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>Asistente Wearable para No Videntes</title>
    <link rel="manifest" href="./manifest.webmanifest">

    <!-- TensorFlow.js y COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --panel-alt: #262626;
            --green: #4CAF50;
            --blue: #2196F3;
            --red: #f44336;
            --text: #ffffff;
            --muted: #d0d0d0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
            padding: 16px;
            margin: 0;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        p {
            margin: 8px 0;
        }

        button, input {
            font-size: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            margin-top: 10px;
        }

        button {
            background-color: var(--green);
            color: white;
            cursor: pointer;
            margin-right: 5px;
            min-width: 150px;
        }

        .btn-secondary { background-color: var(--blue); }
        .btn-stop { background-color: var(--red); }

        input {
            width: min(90vw, 360px);
            background: var(--panel-alt);
            color: white;
            border: 1px solid #444;
            display: block;
            margin: 12px auto;
            text-align: center;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 18px 0;
        }

        .video-container {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            left: -9999px;
            top: -9999px;
        }

        video {
            width: 1px;
            height: 1px;
            border: none;
            display: block;
            opacity: 0;
            pointer-events: none;
            background: transparent;
        }

        .data-box {
            background: var(--panel);
            padding: 14px 16px;
            border-radius: 10px;
            margin-top: 14px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .status-pill {
            display: inline-block;
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.6);
            border-radius: 999px;
            padding: 6px 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>Asistente Wearable</h1>
    <p id="loadingText">Inicializando sensores y voz...</p>
    <div class="status-pill" id="voiceState">Voz: desactivada</div>

    <div class="sr-only" aria-live="polite" id="srStatus">Sistema listo</div>

    <div>
        <input type="text" id="destinationInput" placeholder="Ingrese destino (ej. San Martín 2500)">
        <button id="setRouteBtn" class="btn-secondary">Establecer Ruta</button>
        <button id="mapsBtn">Abrir en Google Maps</button>
    </div>

    <div class="controls">
        <button id="listenBtn">Activar Voz</button>
        <button id="startBtn">Iniciar Marcha</button>
        <button id="exploreBtn" class="btn-secondary">Explorar Entorno</button>
        <button id="stopBtn" class="btn-stop">Detener</button>
    </div>

    <div class="video-container">
        <video id="cameraStream" autoplay playsinline muted></video>
    </div>

    <div class="data-box">
        <h3>Estado:</h3>
        <p id="modeStatus">Modo: En espera</p>
        <p id="routeStatus">Ruta: Sin destino activo</p>
        <p id="aiStatus">IA: Lista</p>
        <p id="lastCommandStatus">Último comando: ninguno</p>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const exploreBtn = document.getElementById('exploreBtn');
        const stopBtn = document.getElementById('stopBtn');
        const setRouteBtn = document.getElementById('setRouteBtn');
        const mapsBtn = document.getElementById('mapsBtn');
        const listenBtn = document.getElementById('listenBtn');
        const destinationInput = document.getElementById('destinationInput');
        const loadingText = document.getElementById('loadingText');
        const voiceState = document.getElementById('voiceState');
        const srStatus = document.getElementById('srStatus');
        const videoElement = document.getElementById('cameraStream');
        const aiStatus = document.getElementById('aiStatus');
        const modeStatus = document.getElementById('modeStatus');
        const routeStatus = document.getElementById('routeStatus');
        const lastCommandStatus = document.getElementById('lastCommandStatus');

        const appState = {
            mode: 'WAITING',
            routeActive: false,
            destination: '',
            lastInstruction: '',
            lastDetectedObject: '',
            voiceEnabled: false,
            lastVoiceCommand: '',
            sceneSummary: 'Sin información visual disponible.'
        };

        let cocoModel = null;
        let audioCtx = null;
        let recognition = null;
        let lastAlertTime = 0;
        let lastSpokenExploreObject = '';
        let lastExploreSpeechTime = 0;
        let currentPosition = null;
        let lastRoutePromptTime = 0;
        let lastSpoken = '';
        let lastSpeechKey = '';
        let lastSpeechTimestamp = 0;

        function vibrate(pattern) {
            if ('vibrate' in navigator) {
                navigator.vibrate(pattern);
            }
        }

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playDistinctSpatialAlert(pan = 0.0) {
            if (!audioCtx) return;
            const isLeft = pan < 0;
            const adjustedPan = isLeft ? -1 : 1;
            const freq = isLeft ? 440 : 880;

            vibrate(isLeft ? [40, 60, 90] : [30, 40]);

            if (!isLeft) {
                playTone(freq, adjustedPan, 0.0, 0.08);
                setTimeout(() => playTone(freq, adjustedPan, 0.0, 0.08), 120);
            } else {
                playTone(freq, adjustedPan, 0.0, 0.2);
            }
        }

        function playTone(freq, pan, delay, duration) {
            const startTime = audioCtx.currentTime + delay;
            const osc = audioCtx.createOscillator();
            const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.35, startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            osc.connect(gain);

            if (panner) {
                panner.pan.setValueAtTime(pan, startTime);
                gain.connect(panner);
                panner.connect(audioCtx.destination);
            } else {
                gain.connect(audioCtx.destination);
            }

            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function speak(text, force = false) {
            if (!('speechSynthesis' in window)) return;
            if (force) window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 1.15;
            utterance.pitch = 1.0;
            lastSpoken = text;
            appState.lastInstruction = text;
            window.speechSynthesis.speak(utterance);
        }

        function announceIfNeeded(key, message, minIntervalMs = 4000) {
            const now = Date.now();
            const shouldSpeak = !lastSpeechKey || key !== lastSpeechKey || (now - lastSpeechTimestamp) >= minIntervalMs;
            if (!shouldSpeak) return;
            lastSpeechKey = key;
            lastSpeechTimestamp = now;
            speak(message);
        }

        function humanizeDirectionText(pan) {
            if (pan < -0.25) return 'a la izquierda';
            if (pan > 0.25) return 'a la derecha';
            return 'al frente';
        }

        function humanizeAlertMessage(pan) {
            if (pan < -0.25) return 'Obstáculo a la izquierda. Desvíe hacia la derecha.';
            if (pan > 0.25) return 'Obstáculo a la derecha. Desvíe hacia la izquierda.';
            return 'Obstáculo al frente. Deténgase y rodee.';
        }

        function humanizeExplorationMessage(translated, pan) {
            const side = humanizeDirectionText(pan);
            return `${translated} ${side}.`;
        }

        function updateVoiceStatus(active) {
            appState.voiceEnabled = active;
            voiceState.textContent = active ? 'Voz: activa' : 'Voz: desactivada';
            voiceState.style.background = active ? 'rgba(76, 175, 80, 0.18)' : 'rgba(255,255,255,0.08)';
        }

        function setLastCommand(text) {
            appState.lastVoiceCommand = text;
            lastCommandStatus.textContent = `Último comando: ${text}`;
            srStatus.textContent = text;
        }

        function setMode(modeText) {
            appState.mode = modeText;
            modeStatus.textContent = `Modo: ${modeText}`;
        }

        function buildGoogleMapsUrl(dest) {
            const cleanDest = encodeURIComponent(dest.trim());
            if (currentPosition) {
                return `https://www.google.com/maps/dir/?api=1&origin=${currentPosition.lat},${currentPosition.lon}&destination=${cleanDest}&travelmode=walking`;
            }
            return `https://www.google.com/maps/search/?api=1&query=${cleanDest}`;
        }

        function openGoogleMapsRoute(dest = appState.destination) {
            const target = (dest || destinationInput.value || '').trim();
            if (!target) {
                announceIfNeeded('maps-empty', 'Ingrese un destino antes de abrir Google Maps.', 8000);
                return;
            }

            const url = buildGoogleMapsUrl(target);
            try {
                window.open(url, '_blank', 'noopener,noreferrer');
                announceIfNeeded('maps-open', `Ruta abierta en Google Maps para ${target}.`, 15000);
                setLastCommand(`Abrir ruta: ${target}`);
            } catch (error) {
                console.warn('No se pudo abrir Google Maps:', error);
                announceIfNeeded('maps-fallback', 'No se pudo abrir Google Maps en esta ventana. Copie la ruta manualmente o use la búsqueda del navegador.', 12000);
            }
        }

        function setDestination(dest) {
            appState.destination = dest;
            appState.routeActive = true;
            routeStatus.textContent = `Ruta: ${dest} (Google Maps)`;
            announceIfNeeded('route-set', `Ruta establecida hacia ${dest}.`, 10000);
            openGoogleMapsRoute(dest);
            setLastCommand(`Ruta hacia ${dest}`);
        }

        function stopAssistant() {
            appState.routeActive = false;
            appState.mode = 'STOPPED';
            modeStatus.textContent = 'Modo: Detenido';
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            speak('Sistema en pausa.', true);
            setLastCommand('Detener');
        }

        function startWalkingMode() {
            initAudioContext();
            startCamera();
            appState.routeActive = Boolean(appState.destination);
            appState.mode = 'NAVIGATING';
            modeStatus.textContent = 'Modo: Marcha y Ruta Activa';
            speak('Modo marcha activado.', true);
            setLastCommand('Iniciar marcha');
            mainLoop();
        }

        function startExploringMode() {
            initAudioContext();
            startCamera();
            appState.mode = 'EXPLORING';
            modeStatus.textContent = 'Modo: Exploración Continua';
            lastSpokenExploreObject = '';
            speak('Modo exploración continua activado. Mueva la cámara lentamente.', true);
            setLastCommand('Explorar entorno');
            mainLoop();
        }

        function answerLocation() {
            if (currentPosition) {
                speak(`Ubicación aproximada: latitud ${currentPosition.lat.toFixed(5)}, longitud ${currentPosition.lon.toFixed(5)}.`);
            } else {
                speak('Todavía no tengo una ubicación precisa. Intente activar el GPS o espere un momento.');
            }
        }

        function askAboutEnvironment() {
            const narrative = appState.sceneSummary || 'No se detectan objetos importantes en este momento.';
            if (appState.mode === 'WAITING' || appState.mode === 'STOPPED') {
                announceIfNeeded('context-waiting', 'El sistema está en espera. Puede iniciar marcha o explorar el entorno.', 15000);
                return;
            }

            const routeHint = appState.routeActive ? 'La ruta sigue activa.' : 'No hay una ruta activa ahora.';
            const normalizedNarrative = narrative.replace(/\./g, '').trim();
            const humanReply = `${normalizedNarrative}. ${routeHint}`;
            announceIfNeeded('context-environment', humanReply, 15000);
        }

        function extractDestination(text) {
            return text
                .replace(/^(asistente|ayuda|por favor|quiero ir a|ir a|ruta a|destino a|destino )/i, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function handleVoiceCommand(command) {
            const normalized = command.toLowerCase().trim();
            if (!normalized) return;

            setLastCommand(command);

            if (/iniciar marcha|comenzar marcha|caminar|marcha/.test(normalized)) {
                startWalkingMode();
                return;
            }

            if (/explorar|observar|reconocer|qué hay alrededor|que hay alrededor/.test(normalized)) {
                startExploringMode();
                return;
            }

            if (/detener|pausar|alto|basta/.test(normalized)) {
                stopAssistant();
                return;
            }

            if (/ir a|ruta a|destino|quiero ir a/.test(normalized)) {
                const dest = extractDestination(normalized);
                if (dest) {
                    setDestination(dest);
                } else {
                    announceIfNeeded('voice-destination', 'No entendí el destino. Repítalo por favor.', 8000);
                }
                return;
            }

            if (/dónde estoy|donde estoy|ubicación|localización/.test(normalized)) {
                answerLocation();
                return;
            }

            if (/qué hay|que hay|adelante|frente|izquierda|derecha|hay gente|hay salida|salida cercana|qué hay a la|que hay a la/.test(normalized)) {
                askAboutEnvironment();
                return;
            }

            if (/repetir|repita|dilo otra vez|repite/.test(normalized)) {
                announceIfNeeded('voice-repeat', lastSpoken || 'No hay una instrucción reciente.', 8000);
                return;
            }

            if (/ayuda|comandos|menu/.test(normalized)) {
                announceIfNeeded('voice-help', 'Puedes decir iniciar marcha, explorar entorno, detener, ir a un destino, dónde estoy o qué hay delante.', 12000);
                return;
            }

            announceIfNeeded('voice-unknown', 'No entendí la instrucción. Puedo ayudar con marcha, exploración, destino o preguntas del entorno.', 12000);
        }

        function buildSceneSummary(predictions) {
            if (!predictions || predictions.length === 0) {
                return 'No hay objetos importantes detectados frente a usted.';
            }

            const top = predictions
                .filter(p => p.score > 0.55)
                .sort((a, b) => b.score - a.score)[0];

            if (!top) {
                return 'No hay objetos importantes detectados frente a usted.';
            }

            const translated = translateClass(top.class);
            const videoWidth = videoElement.videoWidth || 640;
            const objectX = top.bbox[0] + (top.bbox[2] / 2);
            const normalized = (objectX / videoWidth) * 2 - 1;
            const side = normalized < -0.25 ? 'a la izquierda' : normalized > 0.25 ? 'a la derecha' : 'al frente';

            appState.lastDetectedObject = translated;
            return `Hay ${translated.toLowerCase()} ${side}.`;
        }

        function describeExplorationObject(translated, pan) {
            const sideText = humanizeDirectionText(pan);
            return `${translated} ${sideText}.`;
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                listenBtn.disabled = true;
                listenBtn.textContent = 'Voz no disponible';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript;
                const cleaned = transcript.trim();
                if (cleaned) {
                    handleVoiceCommand(cleaned);
                }
            };

            recognition.onerror = (event) => {
                console.warn('Speech recognition error:', event.error);
                if (event.error !== 'no-speech') {
                    speak('No pude escuchar bien. Inténtelo nuevamente.');
                }
            };

            recognition.onend = () => {
                if (recognition && appState.voiceEnabled) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.warn('No se pudo reiniciar reconocimiento:', e);
                    }
                }
            };

            updateVoiceStatus(false);
        }

        function toggleVoiceCapture() {
            if (!recognition) {
                speak('La voz aún no está disponible en este navegador.');
                return;
            }

            try {
                if (appState.voiceEnabled) {
                    recognition.stop();
                    updateVoiceStatus(false);
                    speak('Asistente de voz detenido.');
                    return;
                }

                recognition.start();
                updateVoiceStatus(true);
                speak('Asistente de voz activado.', true);
                setLastCommand('Voz activada');
            } catch (error) {
                console.warn('Speech start error:', error);
            }
        }

        async function initSystem() {
            try {
                await tf.ready();
                cocoModel = await cocoSsd.load();
                loadingText.textContent = 'Sistema preparado. Puedes usar voz o tocar los controles.';
                speak('Sistema listo. Puedes decir iniciar marcha, explorar entorno o detener.', true);
                initSpeechRecognition();
            } catch (error) {
                console.error(error);
                loadingText.textContent = 'Error al iniciar modelos, pero la PWA sigue funcionando como asistente básico.';
                initSpeechRecognition();
            }
        }

        async function startCamera() {
            try {
                if (!videoElement.srcObject) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    });
                    videoElement.srcObject = stream;
                }
            } catch (e) {
                console.error('Error de cámara', e);
                speak('No se pudo acceder a la cámara.');
            }
        }

        listenBtn.addEventListener('click', () => {
            initAudioContext();
            toggleVoiceCapture();
        });

        setRouteBtn.addEventListener('click', () => {
            const dest = destinationInput.value.trim();
            if (dest) {
                setDestination(dest);
            } else {
                announceIfNeeded('route-empty', 'Por favor, ingrese un destino válido.', 10000);
            }
        });

        mapsBtn.addEventListener('click', () => {
            const dest = destinationInput.value.trim() || appState.destination;
            if (dest) {
                openGoogleMapsRoute(dest);
            } else {
                announceIfNeeded('maps-empty', 'Ingrese un destino para abrir una ruta en Google Maps.', 8000);
            }
        });

        startBtn.addEventListener('click', startWalkingMode);
        exploreBtn.addEventListener('click', startExploringMode);
        stopBtn.addEventListener('click', stopAssistant);

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    currentPosition = {
                        lat: position.coords.latitude,
                        lon: position.coords.longitude,
                    };

                    if (appState.routeActive && Date.now() - lastRoutePromptTime > 18000) {
                        const routeMessage = appState.destination
                            ? `Ruta activa hacia ${appState.destination}. Siga la dirección de Google Maps y manténgase en la trayectoria esperada.`
                            : 'Ruta activa. Siga la dirección indicada y manténgase en la trayectoria esperada.';
                        speak(routeMessage);
                        lastRoutePromptTime = Date.now();
                    }
                },
                (error) => {
                    console.error('GPS error:', error);
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
            );
        }

        async function mainLoop() {
            if (appState.mode === 'WAITING' || appState.mode === 'STOPPED') return;

            if (cocoModel && videoElement.readyState === 4) {
                try {
                    const predictions = await cocoModel.detect(videoElement);
                    appState.sceneSummary = buildSceneSummary(predictions);

                    if (appState.mode === 'NAVIGATING') {
                        const relevantObstacles = predictions.filter(p => p.score > 0.55);
                        if (relevantObstacles.length > 0) {
                            const closest = relevantObstacles.reduce((prev, curr) => (prev.bbox[1] > curr.bbox[1]) ? prev : curr);
                            const videoWidth = videoElement.videoWidth || 640;
                            const objectX = closest.bbox[0] + (closest.bbox[2] / 2);
                            const normalizedPan = (objectX / videoWidth) * 2 - 1;

                            const now = Date.now();
                            const direction = normalizedPan < -0.25 ? 'derecha' : normalizedPan > 0.25 ? 'izquierda' : 'frente';
                            const message = humanizeAlertMessage(normalizedPan);

                            if (now - lastAlertTime > 3500) {
                                playDistinctSpatialAlert(normalizedPan);
                                announceIfNeeded(`obstacle-${direction}`, message, 6000);
                                lastAlertTime = now;
                            }

                            aiStatus.textContent = `Obstáculo (${normalizedPan < 0 ? 'Izquierda' : 'Derecha'})`;
                        } else {
                            aiStatus.textContent = 'Camino despejado';
                        }
                    }

                    if (appState.mode === 'EXPLORING') {
                        if (predictions.length > 0) {
                            const top = predictions.reduce((prev, current) => (prev.score > current.score) ? prev : current);
                            if (top.score > 0.60) {
                                const translated = translateClass(top.class);
                                const videoWidth = videoElement.videoWidth || 640;
                                const objectX = top.bbox[0] + (top.bbox[2] / 2);
                                const pan = (objectX / videoWidth) * 2 - 1;

                                const now = Date.now();
                                const contextualDescription = describeExplorationObject(translated, pan);
                                const sameObject = translated === lastSpokenExploreObject;
                                if (!sameObject || (now - lastExploreSpeechTime) > 12000) {
                                    playDistinctSpatialAlert(pan);
                                    announceIfNeeded(`explore-${translated}`, contextualDescription, 12000);
                                    lastSpokenExploreObject = translated;
                                    lastExploreSpeechTime = now;
                                }

                                aiStatus.textContent = `Explorando: ${translated}`;
                            }
                        } else {
                            aiStatus.textContent = 'Explorando: buscando objetos...';
                            lastSpokenExploreObject = '';
                        }
                    }
                } catch (err) {
                    console.error('Error en bucle IA:', err);
                }
            }

            if (appState.mode !== 'WAITING' && appState.mode !== 'STOPPED') {
                setTimeout(mainLoop, appState.mode === 'NAVIGATING' ? 500 : 1000);
            }
        }

        function translateClass(className) {
            const translations = {
                person: 'Persona',
                bicycle: 'Bicicleta',
                car: 'Auto',
                chair: 'Silla',
                'potted plant': 'Planta',
                backpack: 'Mochila o bulto',
                dog: 'Perro',
                'stop sign': 'Señal de alto',
                'traffic light': 'Semáforo',
                bench: 'Banco'
            };
            return translations[className] || className;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((error) => {
                    console.warn('Service worker no registrado:', error);
                });
            });
        }

        initSystem();
    </script>
</body>
</html>
